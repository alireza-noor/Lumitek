<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76e6c3"/>
      <stop offset="1" stop-color="#7ca7ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#061018" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#sheen)"/>
  <!-- circuit node ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#061018" stroke-opacity=".16" stroke-width="10" stroke-dasharray="34 26" stroke-linecap="round"/>
  <!-- stylized L with energy spark -->
  <g filter="url(#soft)">
    <path d="M186 118 L268 118 L268 318 L366 318 L366 394 L186 394 Z" fill="#061018" fill-opacity=".92"/>
  </g>
  <!-- lightning bolt over the L -->
  <path d="M300 96 L234 218 L286 218 L246 316 L352 186 L292 186 L340 96 Z" fill="#ffffff" stroke="#061018" stroke-opacity=".14" stroke-width="6"/>
  <!-- spark dots -->
  <circle cx="382" cy="130" r="17" fill="#ffffff" fill-opacity=".95"/>
  <circle cx="136" cy="368" r="11" fill="#061018" fill-opacity=".45"/>
</svg>
